dataset:
  root: "D:/projects/rl-ball-fetch/ball_fetch/vis_backbone/datasets/manual_capture/20260316_204706"
  train_split_file: "temperal/data/splits_20260316_204706/train.txt"
  val_split_file: "temperal/data/splits_20260316_204706/val.txt"
  test_split_file: "temperal/data/splits_20260316_204706/test.txt"
  observation_length: 8
  frame_stride: 2
  use_last_n_frames: false
  observation_end_fraction: 0.67
  sampling_mode: "uniform_visible"
  img_size: 64
  grayscale: true

model:
  name: single_frame
  encoder_channels: [16,32,64]
  hidden_dim: 128

training:
  seed: 42
  device: auto
  epochs: 1
  batch_size: 16
  lr: 1e-3
  weight_decay: 0.0
  output_dir: "temperal/outputs/single_frame_smoke_20260316"

eval:
  thresholds: [0.2]

logging:
  checkpoint_freq: 1
  save_predictions: false
