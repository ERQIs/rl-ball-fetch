dataset:
  root: "D:/projects/rl-ball-fetch/ball_fetch/vis_backbone/datasets/manual_capture/20260316_220723"
  train_split_file: "temperal/data/splits_20260316_220723/train.txt"
  val_split_file: "temperal/data/splits_20260316_220723/val.txt"
  test_split_file: "temperal/data/splits_20260316_220723/test.txt"
  seq_len: 12
  history_len: 8
  future_len: 4
  frame_stride: 2
  clip_start_stride: 6
  train_max_clips: 2048
  val_max_clips: 512
  test_max_clips: 512
  img_size: 64
  grayscale: true
  out_channels: 3
  pos_cols: ["ball_px", "ball_py", "ball_pz"]
  vel_cols: ["ball_vx", "ball_vy", "ball_vz"]

model:
  c1: 8
  c2: 8
  c3: 8
  s1: 8
  s2: 8
  s3: 8
  decoder_proj_ch: 8
  decoder_hidden_ch: 8
  enable_frame_recon: true
  future_recon_len: 4

loss:
  lambda_frame: 1.0
  lambda_p: 1.0
  lambda_v: 0.2

training:
  seed: 42
  device: auto
  epochs: 1
  batch_size: 8
  lr: 3e-4
  weight_decay: 0.0
  output_dir: "temperal/outputs/multiscale_future_smoke_20260316_220723"
