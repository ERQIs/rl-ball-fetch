dataset:
  root: "D:/projects/rl-ball-fetch/ball_fetch/vis_backbone/datasets/manual_capture/20260316_220723"
  train_split_file: "temperal/data/splits_20260316_220723/train.txt"
  val_split_file: "temperal/data/splits_20260316_220723/val.txt"
  img_size: 64
  grayscale: true
  out_channels: 3
  pair_step: 1
  train_max_pairs: 8192
  val_max_pairs: 2048

model:
  c1: 8
  c2: 8
  c3: 8
  decoder_mode: "f3"

loss:
  lambda_rec: 1.0
  lambda_trans_f2: 0.15
  lambda_trans: 1.0
  lambda_wd: 1.0
  lambda_nb: 0.1
  foreground_weight: 6.0
  foreground_dark_threshold: 0.55
  foreground_dilate_kernel: 5

training:
  seed: 42
  device: auto
  epochs: 15
  batch_size: 32
  lr: 1e-3
  weight_decay: 0.0
  log_every_batches: 25
  output_dir: "temperal/experiments/continuity_prior/output/multiscale_spatial_prior_train_888_15ep_20260325"
  tensorboard_dir: "temperal/experiments/continuity_prior/output/multiscale_spatial_prior_train_888_15ep_20260325/tb"
